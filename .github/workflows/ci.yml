name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: typecheck / build / smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build (host + client)
        run: pnpm run build

      # 盯住 dsh 上游契约（settings 表单 / agent/assistant-stream / configForms / ModuleLoader）
      - name: Smoke (upstream API contracts)
        run: pnpm run smoke
